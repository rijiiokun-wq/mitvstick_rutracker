plugins {
    id 'com.android.application'
}

def speedOverlayTimeoutMs = (project.findProperty('speedOverlayTimeoutMs') ?: '600000').toLong()

android {
    namespace 'com.local.rutrackerplayer'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.local.rutrackerplayer'
        minSdk 28
        targetSdk 34
        versionCode 9
        versionName '0.2.7'
        buildConfigField 'long', 'SPEED_OVERLAY_TIMEOUT_MS', "${speedOverlayTimeoutMs}L"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
